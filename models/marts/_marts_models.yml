version: 2

models:
  - name: dim_customers
    description: "Table de dimension des clients enrichie avec les statistiques de commandes."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: lifetime_value
        description: "Montant total dépensé par le client depuis sa première commande."

  - name: fct_orders
    description: "Table de faits contenant toutes les transactions de commandes."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: amount
        description: "Montant net de la commande en dollars."